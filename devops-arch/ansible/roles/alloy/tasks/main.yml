---- name: Install required packages  apt:    name:      - unzip      - wget    state: present    update_cache: yes- name: Create alloy group  group:    name: alloy    system: yes    state: present- name: Create alloy user  user:    name: alloy    group: alloy    system: yes    shell: /bin/false    createhome: no- name: Create alloy directories  file:    path: "{{ item }}"    state: directory    mode: 0755    owner: alloy    group: alloy  loop:    - /etc/alloy    - /var/lib/alloy- name: Download Alloy  get_url:    url: "https://github.com/grafana/alloy/releases/download/v1.0.0/alloy-linux-amd64.zip"    dest: /tmp/alloy.zip    timeout: 120- name: Extract Alloy  unarchive:    src: /tmp/alloy.zip    dest: /tmp/    remote_src: yes    creates: /tmp/alloy-linux-amd64/alloy- name: Install Alloy binary  copy:    src: "/tmp/alloy-linux-amd64/alloy"    dest: "/usr/local/bin/alloy"    mode: 0755    remote_src: yes- name: Deploy Alloy configuration  template:    src: alloy-config.yml.j2    dest: /etc/alloy/alloy-config.yml    owner: alloy    group: alloy    mode: 0644- name: Deploy Alloy systemd service  template:    src: alloy.service.j2    dest: /etc/systemd/system/alloy.service    mode: 0644- name: Start and enable Alloy  systemd:    name: alloy    state: started    enabled: yes    daemon_reload: yes- name: Wait for Alloy to be ready  wait_for:    port: "{{ alloy_port }}"    host: "localhost"    timeout: 30  ignore_errors: yes- name: Cleanup temp files  file:    path: "{{ item }}"    state: absent  loop:    - /tmp/alloy.zip    - /tmp/alloy-linux-amd64- name: Display Alloy status  debug:    msg: |      ✅ Alloy is running on {{ ansible_host }}      Sending logs to: {{ loki_url }}