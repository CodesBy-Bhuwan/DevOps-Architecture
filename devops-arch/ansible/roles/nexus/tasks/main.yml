---
- name: Create Nexus data directory
  file:
    path: /opt/nexus-data
    state: directory
    mode: '0777'

- name: Remove existing Nexus container
  command: docker rm -f nexus
  ignore_errors: yes

- name: Run Nexus container
  command: >
    docker run -d
    --name nexus
    --restart unless-stopped
    -p 8081:8081
    -p 8082:8082
    -p 8083:8083
    -v /opt/nexus-data:/nexus-data
    -e "NEXUS_SECURITY_RANDOM_PASSWORD=false"
    sonatype/nexus3:3.79.0

- name: Wait for Nexus to be ready
  uri:
    url: "http://{{ ansible_host }}:8081/service/rest/v1/status"
    method: GET
    status_code: 200
  register: nexus_status
  until: nexus_status.status == 200
  retries: 60
  delay: 5

# 1. Dynamically fetch the password without exposing it
- name: Get Nexus initial admin password
  ansible.builtin.command: docker exec nexus cat /nexus-data/admin.password
  register: nexus_admin_password
  changed_when: false
  no_log: true  # Hides the output from your terminal logs!

# 2. Use the dynamic variable for the API call
- name: Create Docker Hosted Repository in Nexus
  uri:
    url: "http://{{ ansible_host }}:8081/service/rest/v1/repositories/docker/hosted"
    method: POST
    user: "admin"
    password: "{{ nexus_admin_password.stdout }}" # Injected dynamically!
    body_format: json
    headers:
      Content-Type: "application/json"
    body: |
      {
        "name": "docker-hosted",
        "online": true,
        "storage": {
          "blobStoreName": "default",
          "strictContentTypeValidation": false
        },
        "docker": {
          "v1Enabled": false,
          "forceBasicAuth": true,
          "httpPort": 8082
        }
      }
    status_code: [201, 400]
  changed_when: false
  no_log: true # Hides the password from being logged in the URI module!
