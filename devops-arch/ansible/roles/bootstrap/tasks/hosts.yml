---
# =============================================================================
# Bootstrap Operating System
# =============================================================================

- name: Verify Ansible connectivity
  ansible.builtin.ping:

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - wget
      - unzip
      - vim
      - net-tools
    state: present

- name: Configure cluster hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE CLUSTER HOSTS"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host]['ansible_host'] }} {{ host }}
      {% endfor %}

- name: Verify hostname resolution
  ansible.builtin.command: ping -c 1 {{ item }}
  loop: "{{ groups['all'] }}"
  changed_when: false

- name: Verify Ansible connectivity
  ansible.builtin.ping:
