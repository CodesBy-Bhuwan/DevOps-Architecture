---
# =============================================================================
# Configure Passwordless SSH
# =============================================================================

- name: Ensure .ssh directory exists on master
  ansible.builtin.file:
    path: /home/vagrant/.ssh
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0700"
  when: inventory_hostname == "master"

- name: Generate SSH key pair on master
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -f /home/vagrant/.ssh/id_ed25519
    creates: /home/vagrant/.ssh/id_ed25519
  become_user: vagrant
  when: inventory_hostname == "master"

- name: Read master's public key
  ansible.builtin.slurp:
    src: /home/vagrant/.ssh/id_ed25519.pub
  delegate_to: master
  register: master_public_key
  run_once: true

- name: Ensure .ssh directory exists on workers
  ansible.builtin.file:
    path: /home/vagrant/.ssh
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0700"
  when: inventory_hostname != "master"

- name: Authorize master's public key on workers
  ansible.posix.authorized_key:
    user: vagrant
    key: "{{ master_public_key.content | b64decode }}"
    state: present
  when: inventory_hostname != "master"

- name: Bootstrap SSH completed
  ansible.builtin.debug:
    msg: "Passwordless SSH has been configured."
  run_once: true
