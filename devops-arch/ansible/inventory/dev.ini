### Step 2: Update Vagrant Inventory (`dev.ini`)
Here we map the functional groups to your 3 Vagrant servers. The Master gets all the DevOps tools + K8s Master. The 2 Workers get the K8s Worker role.

**File:** `ansible/inventory/dev.ini`
```ini
# --- DevOps Tools (All on Vagrant Master) ---
[jenkins]
192.168.56.10 ansible_user=vagrant

[sonarqube]
192.168.56.10 ansible_user=vagrant

[nexus]
192.168.56.10 ansible_user=vagrant

[prometheus]
192.168.56.10 ansible_user=vagrant

[grafana]
192.168.56.10 ansible_user=vagrant

# --- Kubernetes ---
[k8s_master]
192.168.56.10 ansible_user=vagrant

[k8s_workers]
192.168.56.11 ansible_user=vagrant
192.168.56.12 ansible_user=vagrant
